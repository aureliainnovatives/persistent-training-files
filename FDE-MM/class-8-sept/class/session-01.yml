  - Sentense --> Token --> Token Id --> Vector Embeddings - Setence Embedding
  - Hey, I am Mayur and I am happy to be here, Maharaj
  - 10814, 11, 314, 716, 1737, 333, 290, 314, 716, 3772, 284, 307, 994, 11, 31692, 1228
