  - SUV = [length, width, height, engine size]
  - I am happy | I am glad | I am NOT sad | I am subtle

- Model Mechanics
  - Probabilistic Generation
    FDE lens: Where is variability acceptable, 
              and where does it become business risk?

  - Autoregressive generation and error propagation
    FDE lens: How far can an early model mistake propagate 
              before the system detects it?
  
  - Temperature and top-p and top-k
    FDE lens: Decoding configuration should follow the business
     behaviour required---not developer preference.
  
  - Deterministic versus Probabilistic Workloads
    FDE lens: Don't ask, "Can the LLM do this?" 
    Ask, "Should the LLM be allowed to decide this?"

  -  Instruction Following and Competing Instructions
    FDE lens: When the model disobeys an instruction, 
    first determine what other instruction or context it was 
    attempting to satisfy.